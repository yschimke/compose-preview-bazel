name: Bazel rules
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bazel-rules-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Bazel rules validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test packaging and build the module archive
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/package.py --out build/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rules-module
          path: build/release/*
          if-no-files-found: error
  buildifier:
    name: Starlark format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install buildifier
        env:
          BUILDIFIER_VERSION: v8.2.1
          BUILDIFIER_SHA256: 6ceb7b0ab7cf66fceccc56a027d21d9cc557a7f34af37d2101edb56b92fcfa1a
        run: |
          curl -fsSL -o "$RUNNER_TEMP/buildifier" \
            "https://github.com/bazelbuild/buildtools/releases/download/$BUILDIFIER_VERSION/buildifier-linux-amd64"
          echo "$BUILDIFIER_SHA256  $RUNNER_TEMP/buildifier" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/buildifier"
      # Fix locally with `buildifier -lint=fix -r .`.
      - name: Check formatting and lint
        run: '"$RUNNER_TEMP/buildifier" -mode=check -lint=warn -r .'
  analysis:
    name: Analysis tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # v0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
      # rules_testing analysis tests in this module's own workspace, then the render actions'
      # execution requirements, which Starlark cannot see, read back with aquery.
      - name: Run the analysis tests
        env:
          COMPOSE_PREVIEW_BAZEL_TEST: "1"
        run: |
          bazel test //tests/analysis/...
          python3 -m unittest -v tests/test_analysis_aquery.py
  android-aspect:
    name: Android aspect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # v0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
      # Real rules_android android_library targets on the runner's preinstalled SDK
      # (ANDROID_HOME): links resources and checks the schema-2 metadata.
      - name: Build the Android aspect fixture
        env:
          COMPOSE_PREVIEW_ANDROID_ASPECT_TEST: "1"
        run: python3 -m unittest -v tests/test_android_aspect.py
  external:
    name: External Compose consumer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/compose-ai-contrib
          ref: ba35b753ed658f6a68807c1e4893866ae5444ab5
          path: contrib
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          ref: 72ac1b587bf06312a4bd85147fac4511da8a0d04
          path: tools
          persist-credentials: false
      - uses: ./tools/.github/actions/setup
      - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # v0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
      - name: Build the current CLI adapter
        working-directory: tools
        run: ./gradlew :bundle-producer:check :bundle-producer:installDist :cli:installDist --stacktrace
      - name: Compare CLI-first and native-first renders through external archives
        run: python3 tests/integration.py --fixture contrib/bazel-desktop --cli-dist tools/cli/build/install/compose-preview --producer-dist tools/bundle/producer/build/install/compose-preview-producer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: external-compose-evidence
          path: build/bazel-native
          if-no-files-found: error
  external-android:
    name: External Android consumer
    runs-on: ubuntu-latest
    # A cold cache builds rules_android's own tools (protobuf included).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/compose-ai-contrib
          # main: bazel-apk's kt_android_library, whose Greeting reads Android resources.
          ref: bfa7f5b266d039a5f094b7f7c2a8024916e68ba1
          path: contrib
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/compose-ai-tools
          # main with compose-ai-tools#6023: the producer's artifacts schema 2 and
          # `bundle render`'s Android flags.
          ref: 399ed1139e9b64be674de79186b9576d9c62ce04
          path: tools
          persist-credentials: false
      - uses: ./tools/.github/actions/setup
      - name: Install the pinned Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # v0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
      - name: Build the current CLI and producer
        working-directory: tools
        run: ./gradlew :bundle-producer:installDist :cli:installDist --stacktrace
      # compose_preview over a rules_android library, with a render toolchain declaring the Android
      # daemon and android-all: the render is the cacheable action, byte-identical when executed
      # twice from empty caches, and served from the cache after `bazel clean`.
      - name: Render an Android library as a cacheable Bazel action
        run: >-
          python3 tests/integration.py --android-fixture contrib/bazel-apk
          --android-check contrib/.github/scripts/check-android-render.py
          --cli-dist tools/cli/build/install/compose-preview
          --producer-dist tools/bundle/producer/build/install/compose-preview-producer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: external-android-evidence
          path: build/bazel-native/android
          if-no-files-found: warn
